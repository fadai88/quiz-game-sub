name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify-vendor:
    name: Vendor integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify vendor checksums
        run: sha256sum -c public/vendor/checksums.sha256

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=critical

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The suite is self-contained: every Mongo/Redis/Solana boundary is stubbed
      # (sinon) or vm-evaluated, so no service containers are needed. Keep it that
      # way — a test that needs a live service belongs behind its own job.
      - run: npm test

  test-integration:
    name: Tests (real Redis + Mongo)
    runs-on: ubuntu-latest
    # The suites that need live services: the Lua scripts behind the matchmaking
    # claim and the versioned room writes (real Redis), and restart recovery's
    # refund decisions, whose no-double-refund guarantee rests on Mongo's unique
    # index (real Mongo). The main suite's fakes imitate these; this proves them.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REDIS_URL: redis://127.0.0.1:6379
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      REQUIRE_REDIS: "1"
      REQUIRE_MONGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:integration
