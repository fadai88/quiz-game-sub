<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournaments - Quiz Game</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .tournaments-container {
            max-width: 1400px;
            margin: 50px auto;
            padding: 20px;
        }

        .premium-banner {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            padding: 30px;
            color: white;
            text-align: center;
            margin-bottom: 40px;
        }

        .premium-banner h2 {
            margin: 0 0 15px 0;
        }

        .upgrade-btn {
            background: white;
            color: #f5576c;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .tournaments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            margin: 40px 0;
        }

        .tournament-card {
            background: #1e293b;
            border-radius: 15px;
            padding: 25px;
            color: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .tournament-card:hover {
            transform: translateY(-5px);
        }

        .tournament-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .tournament-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .tournament-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-scheduled {
            background: #3b82f6;
        }

        .badge-registration {
            background: #10b981;
        }

        .badge-in-progress {
            background: #f59e0b;
        }

        .badge-completed {
            background: #6b7280;
        }

        .tournament-info {
            margin: 15px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .info-label {
            color: #94a3b8;
        }

        .info-value {
            font-weight: bold;
        }

        .prize-pool {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0;
        }

        .prize-amount {
            font-size: 28px;
            font-weight: bold;
        }

        .participants-count {
            background: rgba(59, 130, 246, 0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
        }

        .tournament-actions {
            margin-top: 20px;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .register-btn {
            background: #10b981;
            color: white;
        }

        .register-btn:hover {
            background: #059669;
        }

        .unregister-btn {
            background: #ef4444;
            color: white;
        }

        .unregister-btn:hover {
            background: #dc2626;
        }

        .join-btn {
            background: #3b82f6;
            color: white;
        }

        .join-btn:hover {
            background: #2563eb;
        }

        .action-btn:disabled {
            background: #6b7280;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .section-title {
            font-size: 28px;
            font-weight: bold;
            margin: 40px 0 20px 0;
            color: white;
        }

        .no-tournaments {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            font-size: 18px;
        }

        .countdown {
            background: rgba(59, 130, 246, 0.2);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <header>
        <h1>Proof of Smart</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="game.html">Play Game</a></li>
                <li><a href="leaderboard.html">Leaderboard</a></li>
                <li><a href="subscription.html">Subscription</a></li>
            </ul>
        </nav>
    </header>
    <div class="tournaments-container">
        <h1>Tournaments</h1>

        <!-- Premium Banner (shown to free users) -->
        <div id="premiumBanner" class="premium-banner" style="display: none;">
            <h2>🏆 Premium Feature</h2>
            <p>Tournaments are exclusive to Premium subscribers</p>
            <p>Compete for real USDC prizes!</p>
            <button class="upgrade-btn" onclick="window.location.href='/subscription.html'">
                Upgrade to Premium
            </button>
        </div>

        <!-- Active Tournaments -->
        <div id="activeTournamentsSection">
            <h2 class="section-title">🔥 Active Tournaments</h2>
            <div id="activeTournaments" class="tournaments-grid"></div>
        </div>

        <!-- Upcoming Tournaments -->
        <div id="upcomingTournamentsSection">
            <h2 class="section-title">📅 Upcoming Tournaments</h2>
            <div id="upcomingTournaments" class="tournaments-grid"></div>
        </div>

        <!-- My Tournament History -->
        <div id="myTournamentsSection">
            <h2 class="section-title">📊 My Tournament History</h2>
            <div id="myTournaments" class="tournaments-grid"></div>
        </div>
    </div>

    <script src="tournaments.js"></script>
</body>
</html>
